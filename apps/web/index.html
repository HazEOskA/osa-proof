<script>
(()=>{
 const params=new URLSearchParams(location.search); if(params.get('debug')==='1')document.documentElement.classList.add('debug');
 const status=document.getElementById('selectionStatus'); const buttons=[...document.querySelectorAll('.hotspot')];
 const base=(window.OSA_API_BASE_URL||'').replace(/\/$/,'');
 async function enter(layer,button){
   if(button.getAttribute('aria-busy')==='true')return;
   button.setAttribute('aria-busy','true'); status.textContent='Checking '+layer+' access';
   try{
     const response=await fetch(base+'/layers/'+encodeURIComponent(layer)+'/enter',{method:'POST',headers:{'content-type':'application/json'}});
     const body=await response.json().catch(()=>({}));
     if(!response.ok)throw new Error(body.error||('OSA API '+response.status));
     if(!body.layer||!body.layer.route)throw new Error('Layer route missing from backend decision');
     window.dispatchEvent(new CustomEvent('osa-layer-select',{detail:body}));
     status.textContent='Layer '+layer+': '+body.decision;
     location.assign(body.layer.route);
   }catch(error){
     console.error('[OSA layer entry]',error); status.textContent='Layer access check failed: '+(error instanceof Error?error.message:String(error));
     window.dispatchEvent(new CustomEvent('osa-layer-error',{detail:{layer,error}}));
   }finally{button.removeAttribute('aria-busy')}
 }
 buttons.forEach(button=>button.addEventListener('click',()=>enter(button.dataset.layer,button)));
 window.addEventListener('keydown',event=>{if(/^[1-6]$/.test(event.key))buttons[Number(event.key)-1]?.click()});
})();
