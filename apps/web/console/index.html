<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OSA Tracing Studio</title>
<meta name="theme-color" content="#08010c" />
<!-- OSA console built on the OSA Framework design system (tokens, Michroma / Exo 2 / JetBrains Mono, GODMODE and PROOF themes).
     Data: static snapshot of 3 sealed runs from the Slice 2 runtime (commit a321fd2) with example executors, embedded below.
     Not wired to the API yet. Features the backend lacks are underlined (.nx). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Michroma&display=swap">
<style>
/* OSA Framework design system (artifact H5SJypMAfm5SrZqYykQuEi): tokens.json + components/bundle.css applied to the tracing console.
   Layout: panel shell on bg-000; bg-100 panels (radius-lg), bg-200 cards (radius-md), bg-300 hover/selected. Motion: running pulse only. */
:root{
  color-scheme:dark;
  /* proof theme */
  --bg-000:#050d17;--bg-100:#070e1c;--bg-200:#0b1527;--bg-300:#181e35;
  --line-100:#304d84;--line-200:#485c75;
  --text-100:#e2ecf7;--text-hero:#d6e5fa;--text-200:#7890b8;--text-300:#556888;
  --steel:#8398c8;--brand:#4b50f8;--text-on-brand:#ffffff;--violet:#7749f0;
  --domain-school:#3d6ad1;--domain-dev:#7749f0;--domain-bank:#50deda;--domain-financial:#cda15a;--domain-cyber:#c3484e;--domain-army:#63d36f;
  --online:#02f477;--success:#02f477;--danger:#d45751;--warning:#cda15a;--info:#50deda;--pending:#7749f0;
  --glow-brand:0 0 0 1px #4b50f8,0 0 24px rgba(75,80,248,.35);
  --glow-violet:0 0 0 1px #7749f0,0 0 24px rgba(119,73,240,.35);
  --shadow-panel:0 24px 64px rgba(0,0,0,.55);
  --font-display:Michroma,"Eurostile Extended",system-ui,sans-serif;
  --font-sans:"Exo 2",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;
  --radius-sm:6px;--radius-md:12px;--radius-lg:24px;--radius-full:9999px;
}
/* godmode theme: builder-facing runtime consoles */
body.godmode{
  --bg-000:#08010c;--bg-100:#0f011c;--bg-200:#1b022c;--bg-300:#2b0444;
  --line-100:#4b096f;--line-200:#b224e3;
  --text-100:#fefbf7;--text-hero:#fedc8a;--text-200:#f273f8;--text-300:#b224e3;
  --steel:#fedc8a;--brand:#f8a541;--text-on-brand:#08010c;--violet:#b224e3;--domain-dev:#b224e3;--pending:#b224e3;
  --glow-brand:0 0 0 1px #f8a541,0 0 24px rgba(248,165,65,.35);
  --glow-violet:0 0 0 1px #b224e3,0 0 24px rgba(178,36,227,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-000);color:var(--text-100);font:400 15px/22px var(--font-sans)}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

/* Not in backend: owner's rule, underline in danger */
.nx{color:var(--text-200);text-decoration:underline;text-decoration-color:var(--danger);text-decoration-thickness:2px;text-underline-offset:4px}

/* Shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--bg-100);border-right:1px solid var(--line-100);padding:var(--space-6) var(--space-3);display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.ws{display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-3) var(--space-6)}
.ws i{width:28px;height:28px;border-radius:var(--radius-sm);display:grid;place-items:center;font:400 12px var(--font-display);font-style:normal;color:var(--text-on-brand);background:var(--brand)}
.ws b{font:400 20px/24px var(--font-display);letter-spacing:.08em;display:block}
.ws small{display:block;font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-200);margin-top:2px}
.side .grp{font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-300);padding:var(--space-6) var(--space-3) var(--space-2)}
.side button{all:unset;display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer;color:var(--text-100);font:500 14px/20px var(--font-sans)}
.side button:hover{background:var(--bg-200)}
.side button[aria-current="page"]{background:var(--bg-300);box-shadow:inset 2px 0 0 var(--brand)}
.side button:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.ic{width:16px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--steel)}
.main{min-width:0;padding-bottom:var(--space-12)}
.bar{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-8);border-bottom:1px solid var(--line-100);background:var(--bg-100);position:sticky;top:0;z-index:3}
.crumbs{font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-200)}
.crumbs b{color:var(--text-100);font-weight:500}
.note{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center;font:400 13px/18px var(--font-sans);color:var(--text-200)}
.themes{display:inline-flex;border:1px solid var(--text-300);border-radius:var(--radius-md);overflow:hidden}
.themes button{all:unset;cursor:pointer;padding:6px var(--space-3);font:500 12px/16px var(--font-sans);letter-spacing:.18em;color:var(--text-200)}
.themes button[aria-pressed="true"]{background:var(--brand);color:var(--text-on-brand)}
.themes button:focus-visible{outline:2px solid var(--steel);outline-offset:-2px}
.live{display:inline-flex;align-items:center;gap:var(--space-2);font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-100)}
.live::before{content:"";width:8px;height:8px;border-radius:var(--radius-full);background:var(--online);box-shadow:0 0 8px var(--online)}

.page{padding:var(--space-8);display:grid;gap:var(--space-6)}
.head{display:grid;gap:var(--space-1)}
h1{margin:0;font:400 28px/36px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--text-hero);text-wrap:balance;overflow-wrap:anywhere}
.sub{margin:0;font:400 13px/18px var(--font-sans);color:var(--text-200)}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
.input{border:1px solid var(--text-300);background:var(--bg-200);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);color:var(--text-200);min-width:240px;font:400 13px/18px var(--font-sans)}

/* Button = osa-btn */
.btn{font:600 14px/20px var(--font-sans);letter-spacing:.04em;display:inline-flex;align-items:center;gap:var(--space-2);padding:10px var(--space-4);border-radius:var(--radius-md);border:1px solid var(--text-300);cursor:pointer;background:var(--bg-200);color:var(--text-100)}
.btn:hover{background:var(--bg-300)}
.btn.primary{background:var(--brand);color:var(--text-on-brand);border-color:transparent;box-shadow:0 0 20px -4px var(--brand)}
.btn.primary:hover{box-shadow:var(--glow-brand)}
.btn.danger{border-color:var(--danger);color:var(--danger)}

/* Panels and cards */
.card{background:var(--bg-100);border:1px solid var(--line-100);border-radius:var(--radius-lg);min-width:0;overflow:hidden}
.card.stat{background:var(--bg-200);border-radius:var(--radius-md)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--line-100);white-space:nowrap;vertical-align:middle;font:400 14px/20px var(--font-sans)}
tbody tr:last-child td{border-bottom:0}
th{font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-200);background:var(--bg-200)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg-200)}
td.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis}

/* StatusBadge: dot plus word, never colour alone */
.st,.badge{display:inline-flex;align-items:center;gap:var(--space-2);font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-100);white-space:nowrap}
.st::before,.badge::before{content:"";width:8px;height:8px;border-radius:var(--radius-full);background:var(--osa-c);box-shadow:0 0 8px var(--osa-c);flex:none}
.badge{padding:4px var(--space-2);border-radius:var(--radius-sm);border:1px solid var(--line-200);background:var(--bg-200)}
.st.ok,.badge.ok{--osa-c:var(--success)}
.st.err,.badge.err{--osa-c:var(--danger)}
.st.warn,.badge.warn{--osa-c:var(--warning)}
.st:empty{gap:0}
.mono{font:400 13px/20px var(--font-mono)}
.muted{color:var(--text-200)}

/* MetricTile */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-6)}
.stat{padding:var(--space-4) var(--space-6);display:flex;flex-direction:column-reverse;justify-content:flex-end}
.stat .v{font:400 28px/36px var(--font-display);letter-spacing:.02em;color:var(--text-100);margin-top:var(--space-2);font-variant-numeric:tabular-nums}
.stat .l{font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-200)}

/* TraceTree + detail */
.split{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);min-height:540px}
.tree{border-right:1px solid var(--line-100);padding:var(--space-2) 0;overflow:auto}
.node{display:grid;grid-template-columns:auto 1fr auto;gap:var(--space-2);align-items:center;padding:var(--space-2) var(--space-4);cursor:pointer;font:400 14px/20px var(--font-sans)}
.node:hover{background:var(--bg-200)}
.node[aria-selected="true"]{background:var(--bg-300);box-shadow:inset 2px 0 0 var(--brand)}
.kind{font:500 11px/16px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-200);border:1px solid var(--line-200);border-radius:var(--radius-sm);padding:0 6px}
.detail{padding:var(--space-6);min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:var(--space-1);border-bottom:1px solid var(--line-100);margin-bottom:var(--space-6)}
.tabs button{all:unset;cursor:pointer;padding:var(--space-2) var(--space-4);font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-200)}
.tabs button[aria-selected="true"]{color:var(--text-100);box-shadow:inset 0 -2px 0 var(--brand)}
.tabs button:focus-visible{outline:2px solid var(--steel);outline-offset:-2px}
.io h4{margin:var(--space-6) 0 var(--space-2);font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-200)}
.io h4:first-child{margin-top:0}
pre{margin:0;font:400 13px/20px var(--font-mono);color:var(--text-100);white-space:pre-wrap;word-break:break-word;background:var(--bg-000);border:1px solid var(--line-100);border-radius:var(--radius-sm);padding:var(--space-3);max-height:340px;overflow:auto}
.kv{display:grid;grid-template-columns:180px minmax(0,1fr);gap:var(--space-2) var(--space-4)}
.kv dt{font:500 12px/20px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-200)}
.kv dd{margin:0;overflow-wrap:anywhere;font:400 13px/20px var(--font-mono)}
.checks{list-style:none;margin:var(--space-4) 0 0;padding:0;display:grid;gap:var(--space-2)}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:var(--space-2);font:400 14px/20px var(--font-sans)}
.ok-t{color:var(--success)}.err-t{color:var(--danger)}
.seal{display:block;margin-top:var(--space-2);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;background:var(--bg-200)}
.seal.ok{border:1px solid var(--success);color:var(--text-100)}
.seal.bad{border:1px solid var(--danger);color:var(--danger)}

/* Studio */
.studio{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;min-height:540px}
.studio>div{min-width:0}
.threads{border-right:1px solid var(--line-100);padding:var(--space-3);display:grid;gap:var(--space-1);align-content:start}
.threads .th{padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer}
.threads .th:hover{background:var(--bg-200)}
.threads .th[aria-selected="true"]{background:var(--bg-300);box-shadow:inset 2px 0 0 var(--brand)}
.canvas{display:grid;place-items:center;padding:var(--space-8)}
.flow{display:grid;justify-items:center;gap:var(--space-2)}
.gnode{background:var(--bg-200);border:1px solid var(--line-100);border-radius:var(--radius-md);padding:var(--space-3) var(--space-6);min-width:180px;text-align:center;font:700 14px/20px var(--font-sans);letter-spacing:.04em;text-transform:uppercase}
.gnode.start,.gnode.end{border-radius:var(--radius-full);min-width:120px;font:400 13px/20px var(--font-mono);text-transform:none;color:var(--text-200)}
.gnode.active{border-color:var(--success)}
.gnode.failed{border-color:var(--danger);color:var(--danger)}
.gnode.planned{border-style:dashed;border-color:var(--text-300);background:transparent}
.arrow{font:400 12px/16px var(--font-mono);color:var(--text-200)}
.state{border-left:1px solid var(--line-100);padding:var(--space-4);display:grid;gap:var(--space-3);align-content:start}
.state b{font:500 12px/16px var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-200)}
.empty{padding:var(--space-6);display:grid;gap:var(--space-3)}
.empty ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-3)}
.empty li{padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);border:1px dashed var(--text-300);background:var(--bg-200)}

@media (max-width:980px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line-100)}.side .grp,.ws{display:none}.split,.studio{grid-template-columns:1fr}.tree,.threads,.state{border:0;border-bottom:1px solid var(--line-100)}.bar{position:static;padding:var(--space-3) var(--space-4)}.page{padding:var(--space-4)}}
@media (max-width:520px){.kv{grid-template-columns:1fr}.input{min-width:0;width:100%}h1{font-size:22px;line-height:28px}}
</style>
</head>

          h("td", { class: "mono", text: when(RUNS[RUNS.length - 1]) }),
          h("td", null, [nx("—")])
        ])])
      ])]),
      h("p", { class: "muted", text: "Error rate liczony w przeglądarce z 3 osadzonych runów; API nie ma listy projektów ani agregacji." })
    ]);
  };

  VIEWS.runs = function(){
    var ver = RUNS.filter(function(r){ return r.verdict === "VERIFIED"; }).length;
    return h("div", { class: "page" }, [
      h("div", { class: "head" }, [h("h1", { text: "team_dev" }), h("p", { class: "sub", text: "Runy projektu. Kliknij run, aby otworzyć trace." })]),
      h("div", { class: "stats" }, [
        h("div", { class: "card stat" }, [h("div", { class: "v", text: String(RUNS.length) }), h("div", { class: "l", text: "Runs" })]),
        h("div", { class: "card stat" }, [h("div", { class: "v", text: String(ver) }), h("div", { class: "l", text: "Proof VERIFIED" })]),
        h("div", { class: "card stat" }, [h("div", { class: "v", text: String(RUNS.length - ver) }), h("div", { class: "l", text: "Proof FAILED" })]),
        h("div", { class: "card stat" }, [h("div", { class: "v" }, [nx("—")]), h("div", { class: "l" }, [nx("P50 latency")])]),
        h("div", { class: "card stat" }, [h("div", { class: "v" }, [nx("—")]), h("div", { class: "l" }, [nx("Tokens")])]),
        h("div", { class: "card stat" }, [h("div", { class: "v" }, [nx("—")]), h("div", { class: "l" }, [nx("Cost")])])
      ]),
      h("div", { class: "toolbar" }, [h("span", { class: "input" }, [nx("Filter runs (status, tags, metadata)")]), h("button", { class: "btn", type: "button" }, [nx("Columns")]), h("button", { class: "btn", type: "button" }, [nx("Add to dataset")]), h("button", { class: "btn", type: "button" }, [nx("Add to annotation queue")]), h("button", { class: "btn", type: "button" }, [nx("Export")])]),
      h("div", { class: "card tbl" }, [h("table", null, [
        h("thead", null, [h("tr", null, ["Name","Input","Output","Status","Proof","Start time","Latency","Tokens","Cost","Tags","Feedback"].map(function(c, i){ return h("th", null, [i >= 6 ? nx(c) : c]); }))]),
        h("tbody", null, RUNS.map(function(run, i){
          function open(){ state.run = i; state.span = "root"; state.tab = "run"; go("trace"); }
          var out = run.final_output && run.final_output.artifact ? (run.final_output.artifact.title || "artifact") : run.final_output && run.final_output.plan ? "plan only" : "—";
          return h("tr", { class: "click", tabindex: "0", onclick: open, onkeydown: keyActivate(open) }, [
            h("td", null, [h("b", { text: run.proof.mission_id })]),
            h("td", { class: "trunc", text: objective(run) }),
            h("td", { class: "trunc", text: out }),
            h("td", null, [statusEl(run.verdict)]),
            h("td", null, [proofBadge(run.verdict)]),
            h("td", { class: "mono", text: when(run) }),
            h("td", null, [nx("—")]), h("td", null, [nx("—")]), h("td", null, [nx("—")]), h("td", null, [nx("—")]), h("td", null, [nx("—")])
          ]);
        }))
      ])])
    ]);
  };

  VIEWS.trace = function(){
    var run = RUNS[state.run];
    if (!state.working || state.working.proof.proof_id !== run.proof.proof_id) state.working = structuredClone(run);
    var tree = spans(state.working), list = flat(tree, 0, []);
    var sel = list.find(function(x){ return x.node.id === state.span; }) || list[0];
    var nodes = list.map(function(item){
      var n = item.node;
      function pick(){ state.span = n.id; render(); }
      return h("div", { class: "node", role: "treeitem", tabindex: "0", "aria-selected": String(n.id === sel.node.id), style: "padding-left:" + (12 + item.depth * 16) + "px", onclick: pick, onkeydown: keyActivate(pick) }, [
        h("span", { class: "kind", text: n.kind }), h("span", { text: n.name }),
        n.status === "FAILED" ? h("span", { class: "st err", text: "" }) : h("span", { class: "st ok", text: "" })
      ]);
    });
    var tabs = [["run","Run"],["proof","Proof"],["feedback","Feedback"],["metadata","Metadata"]];
    return h("div", { class: "page" }, [
      h("div", { class: "toolbar", style: "justify-content:space-between" }, [
        h("div", null, [h("h1", { text: run.proof.mission_id }), h("p", { class: "sub mono", text: run.run_id + " · " + run.execution_id })]),
        h("div", { class: "toolbar" }, [statusEl(run.verdict), proofBadge(run.verdict), h("button", { class: "btn", type: "button" }, [nx("Open in Playground")]), h("button", { class: "btn", type: "button" }, [nx("Share")]), h("button", { class: "btn", type: "button", onclick: function(){ go("runs"); } }, ["← Runs"])])
      ]),
      h("div", { class: "card split" }, [
        h("div", { class: "tree", role: "tree", "aria-label": "Trace" }, nodes),
        h("div", { class: "detail" }, [
          h("div", { class: "tabs", role: "tablist" }, tabs.map(function(t){
            var label = t[0] === "feedback" ? nx(t[1]) : t[1];
            return h("button", { type: "button", role: "tab", "aria-selected": String(state.tab === t[0]), onclick: function(){ state.tab = t[0]; render(); } }, [label]);
          })),
          detailPane(sel.node, run)
        ])
      ])
    ]);
  };

  function detailPane(n, run){
    var w = state.working;
    if (state.tab === "proof") return proofPane(w);
    if (state.tab === "feedback") return h("div", { class: "empty" }, [h("p", { class: "muted", text: "Ocena runu przez człowieka lub evaluatora." }), h("ul", null, [h("li", null, [nx("Thumbs up / down")]), h("li", null, [nx("Score i komentarz")]), h("li", null, [nx("Feedback z evaluatorów online")])])]);
    if (state.tab === "metadata"){
      var dl = h("dl", { class: "kv" });
      [["run_id", w.run_id], ["execution_id", w.execution_id], ["organization", w.proof.organization_id], ["project", w.proof.project_id], ["team", w.proof.team_id + " v" + w.proof.team_version], ["mission", w.proof.mission_id], ["created_at", w.proof.created_at]].forEach(function(p){ dl.appendChild(h("dt", { text: p[0] })); dl.appendChild(h("dd", { class: "mono", text: p[1] })); });
      if (n.op){ dl.appendChild(h("dt", { text: "operation_id" })); dl.appendChild(h("dd", { class: "mono", text: n.op })); }
      dl.appendChild(h("dt", null, [nx("tags")])); dl.appendChild(h("dd", null, [nx("—")]));
      dl.appendChild(h("dt", null, [nx("model / tokens")])); dl.appendChild(h("dd", null, [nx("—")]));
      return dl;
    }
    // Run tab: input / output per span
    if (n.kind === "chain") return h("div", { class: "io" }, [h("h4", { text: "Input" }), h("pre", { text: JSON.stringify({ objective: objective(w) }, null, 2) }), h("h4", { text: "Output" }), h("pre", { text: JSON.stringify(w.final_output, null, 2) })]);
    if (n.kind === "agent") return h("div", { class: "io" }, [
      h("dl", { class: "kv" }, [h("dt", { text: "executor_ref" }), h("dd", { class: "mono", text: n.ref }), h("dt", { text: "status" }), h("dd", null, [statusEl(n.status)])]),
      n.error ? h("div", null, [h("h4", { text: "Error" }), h("pre", { text: n.error })]) : null,
      h("h4", null, [nx("Input / Output tego kroku")]), h("p", { class: "muted", text: "Runtime nie zapisuje wejścia i wyjścia pojedynczego agenta, tylko wynik końcowy." }),
      h("h4", { text: "Events" }), h("pre", { text: n.events.map(function(e){ return e.sequence + "  " + e.type; }).join("\n") })
    ]);
    if (n.kind === "evidence") return h("div", { class: "io" }, [h("h4", { text: "Evidence record" }), h("pre", { text: JSON.stringify(n.evidence, null, 2) }),
      h("h4", { text: "Verifier observations" }), h("pre", { text: w.observations.filter(function(o){ return o.evidence_id === n.evidence.evidence_id; }).map(function(o){ return (o.ok ? "✓ " : "✕ ") + o.check + " · " + o.reason; }).join("\n") })]);
    return proofPane(w);
  }

  function proofPane(w){
    var r = w.proof, dl = h("dl", { class: "kv" });
    [["verdict", r.verdict], ["proof_id", r.proof_id], ["receipt_sha256", r.receipt_sha256], ["evidence_root", r.evidence_root], ["final_output_sha256", r.final_output_sha256], ["runtime_failure", r.runtime_failure || "—"], ["verifier", r.verifier.name + " v" + r.verifier.version]].forEach(function(p){ dl.appendChild(h("dt", { text: p[0] })); dl.appendChild(h("dd", { class: "mono", text: p[1] })); });
    var reqs = h("pre", { text: r.requirement_verdicts.map(function(v){ return v.verdict.padEnd(10) + v.requirement_id + " · " + v.reason; }).join("\n") });
    var checks = h("ul", { class: "checks", "aria-live": "polite" });
    async function run(){
      checks.textContent = "";
      var res = await verify(w);
      res.forEach(function(c){ checks.appendChild(h("li", null, [h("span", { class: c[0] ? "ok-t" : "err-t", text: c[0] ? "✓" : "✕" }), h("span", { text: c[1] })])); });
      var all = res.every(function(c){ return c[0]; });
      checks.appendChild(h("li", { class: "seal " + (all ? "ok" : "bad") }, [all ? "Receipt intact · verdict " + r.verdict + " is binding" : "Receipt tampered · verdict is void"]));
    }
    var box = h("div", { class: "io" }, [dl, h("h4", { text: "Requirements" }), reqs,
      h("div", { class: "toolbar", style: "margin-top:12px" }, [
        h("button", { class: "btn primary", type: "button", onclick: run }, ["Verify receipt in browser"]),
        h("button", { class: "btn", type: "button", onclick: function(){ r.verdict = r.verdict === "VERIFIED" ? "FAILED" : "VERIFIED"; render(); } }, ["Tamper: flip verdict"]),
        h("button", { class: "btn", type: "button", onclick: function(){ var a = w.evidence[w.evidence.length - 1]; a.data.status = a.data.status === "built" ? "rejected" : "built"; render(); } }, ["Tamper: edit evidence"]),
        h("button", { class: "btn", type: "button", onclick: function(){ state.working = structuredClone(RUNS[state.run]); render(); } }, ["Reset"])
      ]), checks,
      h("p", { class: "muted" }, [nx("Podpis receipt"), " · ", nx("Niezależny verifier"), " · ", nx("Eksport receipt")])
    ]);
    setTimeout(run, 0);
    return box;
  }

  VIEWS.studio = function(){
    var run = RUNS[state.thread];
    var failedAgent = (run.events.find(function(e){ return e.type === "AGENT_FAILED"; }) || {}).agent_id;
    function node(id, label){ var cls = "gnode" + (failedAgent === id ? " failed" : " active"); return h("div", { class: cls, text: label }); }
    return h("div", { class: "page" }, [
      h("div", { class: "toolbar", style: "justify-content:space-between" }, [
        h("div", null, [h("h1", { text: "Studio · " + GRAPH.team_id + " v" + GRAPH.version }), h("p", { class: "sub", text: "Graf z Team Graph, wątki to wykonania misji." })]),
        h("div", { class: "toolbar" }, [h("button", { class: "btn", type: "button" }, [nx("Interrupt before node")]), h("button", { class: "btn", type: "button" }, [nx("Interrupt after node")]), h("button", { class: "btn primary", type: "button" }, [nx("Submit new input")])])
      ]),
      h("div", { class: "card studio" }, [
        h("div", { class: "threads" }, [h("div", { class: "muted", style: "padding:4px 8px 8px", text: "Threads" })].concat(RUNS.map(function(r, i){
          function pick(){ state.thread = i; render(); }
          return h("div", { class: "th", tabindex: "0", role: "button", "aria-selected": String(i === state.thread), onclick: pick, onkeydown: keyActivate(pick) }, [h("div", { text: r.proof.mission_id }), h("div", { class: "muted mono", text: short(r.execution_id, 18) })]);
        }))),
        h("div", { class: "canvas" }, [h("div", { class: "flow" }, [
          h("div", { class: "gnode start", text: "__start__" }), h("div", { class: "arrow", text: "↓" }),
          node("planner", "planner"), h("div", { class: "arrow", text: "↓ handoff" }),
          node("builder", "builder"), h("div", { class: "arrow" }, [nx("↓ conditional")]),
          h("div", { class: "gnode planned" }, [nx("reviewer")]), h("div", { class: "arrow", text: "↓" }),
          h("div", { class: "gnode end", text: "__end__" })
        ])]),
        h("div", { class: "state" }, [
          h("b", { text: "State" }),
          h("pre", { text: JSON.stringify(run.final_output, null, 2) }),
          h("div", null, [nx("Edit state and fork")]), h("div", null, [nx("Checkpoints / time travel")]), h("div", null, [nx("Resume from interrupt")]), h("div", null, [nx("Stream tokens")])
        ])
      ])
    ]);
  };

  function planned(title, sub, items){ return function(){ return h("div", { class: "page" }, [h("div", { class: "head" }, [h("h1", null, [nx(title)]), h("p", { class: "sub", text: sub })]), h("div", { class: "card empty" }, [h("ul", null, items.map(function(t){ return h("li", null, [nx(t)]); }))])]); }; }
  VIEWS.monitor = planned("Monitoring", "Wykresy dla projektu w czasie.", ["Trace count", "Latency P50 / P99", "Error rate", "Token usage", "Cost", "Feedback scores", "Alerty"]);
  VIEWS.threads = planned("Threads", "Wieloturowe rozmowy zgrupowane po thread_id.", ["Lista wątków", "Widok rozmowy", "Feedback per turn"]);
  VIEWS.prompts = planned("Prompts & Playground", "Wersjonowane prompty i testowanie na modelach.", ["Prompt hub z wersjami i tagami", "Playground: prompt × model × input", "Porównanie modeli", "Otwórz run w Playground"]);
  VIEWS.datasets = planned("Datasets & Experiments", "Zbiory przykładów i porównanie wersji aplikacji.", ["Datasety z przykładów lub runów", "Evaluatory (heurystyki, LLM-as-judge, własne)", "Eksperymenty i porównanie side-by-side", "Regresja w CI", "Receipty OSA jako oczekiwany wynik eksperymentu"]);
  VIEWS.queues = planned("Annotation queues", "Kolejki runów do oceny przez ludzi.", ["Kolejki z rubrykami", "Przypisanie recenzentów", "Eksport ocen do datasetu"]);
  VIEWS.deploy = planned("Deployments", "Hostowanie grafów agentów jako API.", ["Deploy z repo", "Rewizje i rollback", "Assistants i konfiguracje", "Cron jobs", "Webhooks", "Skalowanie i kolejki zadań"]);
  VIEWS.settings = planned("Settings & API keys", "Organizacja, dostęp i klucze.", ["Klucze API", "Członkowie i role", "SSO", "Retencja danych", "Billing"]);

  function go(view){ state.view = view; if (view !== "trace") state.working = null; render(); window.scrollTo(0, 0); }

  function render(){
    var v = document.getElementById("view"); v.textContent = "";
    v.appendChild(VIEWS[state.view]());
    var navView = state.view === "trace" ? "runs" : state.view;
    document.querySelectorAll(".side button").forEach(function(b){ if (b.dataset.view === navView) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    var c = document.getElementById("crumbs"); c.textContent = "";
    var names = { projects: "Tracing projects", runs: "Tracing projects / team_dev", trace: "team_dev / " + RUNS[state.run].proof.mission_id, studio: "Studio", monitor: "Monitoring", threads: "Threads", prompts: "Prompts", datasets: "Datasets & Experiments", queues: "Annotation queues", deploy: "Deployments", settings: "Settings" };
    c.appendChild(h("span", { text: "org_dev / " })); c.appendChild(h("b", { text: names[state.view] }));
  }

  function setTheme(name){
    document.body.classList.toggle("godmode", name === "godmode");
    document.querySelectorAll(".themes button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.t === name)); });
    try { localStorage.setItem("osa-theme", name); } catch (e) {}
  }
  var saved = "godmode"; try { saved = localStorage.getItem("osa-theme") || "godmode"; } catch (e) {}
  setTheme(saved === "proof" ? "proof" : "godmode");
  document.querySelectorAll(".themes button").forEach(function(b){ b.addEventListener("click", function(){ setTheme(b.dataset.t); }); });
  document.querySelectorAll(".side button").forEach(function(b){ b.addEventListener("click", function(){ go(b.dataset.view); }); });
  render();
})();
</script>
