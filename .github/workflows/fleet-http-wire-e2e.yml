name: Fleet HTTP i SSE — kontrakty bez dostawcy
on:
  push:
    branches: [feature/osa-fleet-chat-slice1-proof]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fleet-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz kanoniczne repozytorium OSA ProofFixes #16 
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Kontrakty transportu HTTP/SSE (odpowiedzi kontrolowane, bez modelu i usługi cloud)
        run: node --test dist/tests/fleet-http-integration.test.js dist/tests/fleet-sse.test.js
