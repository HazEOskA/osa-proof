name: Integration Slice V0.1

on:
  push:
    branches:
      - feature/osa-dashboard-live-control-plane
      - feature/native-builder-v0.1
      - feature/workspace-provider-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.integration.json
      - run: node --test dist-integration/tests/*.test.js
      - name: Build OSA workspace image
        if: github.ref == 'refs/heads/feature/workspace-provider-v0.1'
        run: npm run workspace:image:build
      - name: Live Docker workspace smoke
        if: github.ref == 'refs/heads/feature/workspace-provider-v0.1'
        env:
          OSA_LIVE_DOCKER_TEST: "1"
        run: node --test dist-integration/tests/workspace-provider-live.test.js
