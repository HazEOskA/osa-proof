name: Integration Slice V0.1

on:
  push:
    branches:
      - feature/osa-dashboard-live-control-plane
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.integration.json
      - run: node --test dist-integration/tests/integration-slice.test.js
