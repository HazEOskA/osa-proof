name: OSA P0 Durable Execution — Browser Disconnect
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-resume:
    name: Durable job recovery — Android and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/build-dashboard.cjs
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - name: Close browser mid-job, reopen and check result proof
        run: node scripts/test-durable-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osa-durable-browser-proof
          path: artifacts/durable-browser/
          if-no-files-found: warn
