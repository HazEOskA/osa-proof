name: OSA Native Chat Mobile Regression
on:
  push:
    branches: [feature/osa-fleet-chat-slice1-proof, feature/osa-unified-runtime-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dashboard build and browser
        run: |
          npm ci
          npm install --no-save --no-audit --no-fund playwright@1.63.0
      - name: Build OSA Proof native chat
        run: node scripts/build-dashboard.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve local dashboard
        run: |
          nohup python3 -m http.server 3100 --directory dashboard-dist > /tmp/osa-mobile.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/osa-mobile.log
          exit 1
      - name: Verify native chat sessions, agent selection, no iframe, mobile and desktop
        run: node scripts/test-jeverson-mobile-layout.mjs
      - name: Compile real OSA Runtime for native tool E2E
        run: npm run build
      - name: Browser E2E native chat → OSA Runtime → verified Proof → Replay
        run: node scripts/test-unified-browser.cjs
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osa-native-chat-mobile-regression
          path: |
            artifacts/osa-native-chat/
            artifacts/osa-native-chat-e2e/
          if-no-files-found: ignore
          retention-days: 14
