name: OSA Native Chat Mobile Regression
on:
  push:
    branches: [feature/osa-fleet-chat-slice1-proof, feature/osa-unified-runtime-v1, feature/osa-contextual-guide-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dashboard build and browser
        run: |
          npm ci
      - name: Build OSA Proof native chat
        run: node scripts/build-dashboard.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Kontrakty UI czatu i przewodnika na 320/390/1440 (dostawca symulowany)
        run: node scripts/test-dashboard-browser.cjs
      - name: Compile real OSA Runtime for native tool E2E
        run: npm run build
      - name: Browser E2E native chat → OSA Runtime → verified Proof → Replay
        run: node scripts/test-unified-browser.cjs
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osa-native-chat-mobile-regression
          path: |
            artifacts/osa-native-chat/
            artifacts/osa-guide/
            artifacts/osa-operator/
            artifacts/osa-native-chat-e2e/
          if-no-files-found: ignore
          retention-days: 14
