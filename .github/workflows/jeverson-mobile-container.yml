name: Jeverson Mobile Container Proof
on:
  push:
    branches: [feature/osa-fleet-chat-slice1-proof]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dashboard build and browser
        run: |
          npm ci
          npm install --no-save --no-audit --no-fund playwright@1.63.0
      - name: Build isolated OSA Proof with inert Jeverson URL
        env:
          VITE_OSA_JEVERSON_URL: https://jeverson.ui.test
          VITE_OSA_JEVERSON_THEME_PREVIEW_URL: https://black.ui.test
        run: node scripts/build-dashboard.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve local dashboard
        run: |
          nohup python3 -m http.server 3100 --directory dashboard-dist > /tmp/osa-mobile.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/osa-mobile.log
          exit 1
      - name: Browser test LIVE / BLACK iframe on 320px, 390px and desktop + real protected-alias check
        env:
          OSA_REMOTE_BLACK_URL: https://aether-git-feature-jeverson-verc-268688-osabarca-1680s-projects.vercel.app
        run: node scripts/test-jeverson-mobile-layout.mjs
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jeverson-osa-proof-mobile-layout
          path: artifacts/jeverson-container/
          if-no-files-found: ignore
          retention-days: 14
